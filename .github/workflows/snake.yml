name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F5AF0&color_dots=#ebedf0,#c9d6ff,#9fb4ff,#7F5AF0,#38BDAE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#BF91F3&color_dots=#1A1B27,#2B3A67,#4C5FA8,#70A5FD,#38BDAE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
